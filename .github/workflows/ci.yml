name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit per-cell include, not a php/laravel cross-product with an
        # exclude: the testbench constraint used to be picked by a `${{ }}`
        # ternary chain in the "Constrain to Laravel" step below, and that
        # chain's operator semantics on GitHub Actions could not be verified
        # without a live run. An explicit value per cell removes the ambiguity
        # rather than risk a silent no-op that installs the same testbench in
        # every cell and looks like coverage without being any.
        #
        # orchestra/testbench ^11 (Laravel 13) requires php >= 8.3, so
        # php 8.2 / laravel 13 has no cell.
        include:
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Constrain to Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --dev \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer require --no-update \
            "illuminate/contracts:^${{ matrix.laravel }}.0"

      - name: Install
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPUnit
        run: vendor/bin/phpunit
